# Local development and CI stack: SQL Server 2022 + Azurite. Throwaway data, loopback only, never a real server.
# Driven by `npm run stack:up` / `npm run stack:down` (scripts/stack/stack.ts).
name: portal-local

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server has no arm64 image; Apple Silicon runs it under amd64 emulation (slow start, hence start_period).
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${LOCAL_SQL_SA_PASSWORD:-Local-Dev-Only-1!}
    ports:
      - "127.0.0.1:${LOCAL_SQL_PORT:-14330}:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 90s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"

version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps):"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps):"
    ignore:
      # Runtime is Node 22; type definitions must match it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Toolchain majors are adopted deliberately, not automatically.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps):"

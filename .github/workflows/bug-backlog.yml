name: Bug backlog

on:
  # pull_request, not pull_request_target: GitHub blocks pull_request_target by default in public
  # repositories from 2 December 2026 (issue #34). The job only runs for PRs authored by Copilot or
  # the owner, which are same-repository branches, so the token gets the issues: write granted below.
  # Fork PRs get a read-only token and no secrets, and the author filter skips them anyway.
  pull_request:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: read

# Runs for one PR are serialized and never cancelled; a newer edit replaces only a queued run of the
# same PR, and each run reads the full current PR body, so no report is dropped.
concurrency:
  group: bug-backlog-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  create-issues:
    if: github.event.pull_request.user.login == 'Copilot' || github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/bug-backlog/create-issues.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
